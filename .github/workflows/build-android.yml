name: Build Android APK

# Unity Mobile Game Factory — يبني أي لعبة Unity في هذا المستودع إلى APK تلقائياً عند كل push على main.
#   1) buildalon/unity-setup            → يثبّت Unity (الإصدار من ProjectSettings/ProjectVersion.txt) + Android module
#   2) buildalon/activate-unity-license → ترخيص Personal أونلاين (UNITY_EMAIL / UNITY_PASSWORD فقط، بدون ملف .ulf)
#   3) FactoryBuild.Build                → IL2CPP ARM64(+ARMv7)، الاسم/الحزمة/المشاهد من build.json و ProjectSettings
#   4) نشر الـ APK في Releases باسم اللعبة
#
# Secrets المطلوبة (Settings → Secrets and variables → Actions):
#   UNITY_EMAIL, UNITY_PASSWORD                                   ← إلزامية
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS,
#   ANDROID_KEYALIAS_NAME, ANDROID_KEYALIAS_PASS                  ← اختيارية (بدونها يُوقَّع بـ debug keystore، ويُثبَّت عادي)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      export_type:
        description: 'androidPackage (APK) أو androidAppBundle (AAB لمتجر Google Play)'
        default: androidPackage
        type: choice
        options: [androidPackage, androidAppBundle]

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unity -> Android (IL2CPP)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      BUILD_VERSION: 0.1.${{ github.run_number }}
      EXPORT_TYPE: ${{ github.event.inputs.export_type || 'androidPackage' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules
          sudo docker image prune --all --force || true
          df -h /

      - name: Read game name & Unity version
        id: meta
        run: |
          NAME=$(python3 -c "import json,re;d=json.load(open('build.json')) if __import__('os').path.exists('build.json') else {};print(d.get('productName',''))" 2>/dev/null || true)
          if [ -z "$NAME" ]; then NAME=$(grep -m1 '^  productName:' ProjectSettings/ProjectSettings.asset | sed 's/^  productName: //'); fi
          SLUG=$(echo "$NAME" | sed 's/[^A-Za-z0-9]//g'); [ -n "$SLUG" ] || SLUG=Game
          UV=$(grep -m1 'm_EditorVersion:' ProjectSettings/ProjectVersion.txt | awk '{print $2}')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"; echo "slug=$SLUG" >> "$GITHUB_OUTPUT"; echo "unity=$UV" >> "$GITHUB_OUTPUT"
          echo "Game: $NAME ($SLUG) — Unity $UV"

      - name: Check Unity account secrets
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error title=Unity secrets missing::أضف UNITY_EMAIL و UNITY_PASSWORD في Settings → Secrets and variables → Actions ثم أعد تشغيل الـ workflow."
            exit 1
          fi

      - name: Install Unity ${{ steps.meta.outputs.unity }} + Android module
        uses: buildalon/unity-setup@v2
        with:
          version-file: ProjectSettings/ProjectVersion.txt
          build-targets: Android
          # Workaround for buildalon/unity-setup#57: Hub >= 3.20 installs to /usr/bin, action expects /opt/unityhub
          hub-version: '3.14.3'
          cache-installation: true

      - name: Activate Unity Personal license
        uses: buildalon/activate-unity-license@v2
        with:
          license: Personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Restore Android keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"

      - name: Build (FactoryBuild.Build)
        uses: buildalon/unity-action@v3
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        with:
          project-path: ${{ github.workspace }}
          build-target: Android
          log-name: Android-Build
          args: >-
            -quit -batchmode -nographics
            -executeMethod FactoryBuild.Build
            -buildTarget Android
            -customBuildPath ${{ github.workspace }}/build/Android/${{ steps.meta.outputs.slug }}.apk
            -androidVersionCode ${{ github.run_number }}
            -buildVersion ${{ env.BUILD_VERSION }}
            -androidTargetSdkVersion 34
            -androidExportType ${{ env.EXPORT_TYPE }}

      - name: Locate output
        id: apk
        run: |
          OUT=$(find build -name '*.apk' -o -name '*.aab' | head -n 1)
          test -n "$OUT" || { echo "::error::No APK/AAB produced"; ls -R build || true; exit 1; }
          EXT="${OUT##*.}"
          FILE="${{ steps.meta.outputs.slug }}-v${BUILD_VERSION}.${EXT}"
          cp "$OUT" "$FILE"
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
          ls -lh "$FILE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.slug }}-Android
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Upload Unity log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unity-logs
          path: '**/*.log'
          if-no-files-found: ignore

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BUILD_VERSION }}
          name: ${{ steps.meta.outputs.name }} v${{ env.BUILD_VERSION }}
          body: |
            **${{ steps.meta.outputs.name }}** — مبني تلقائياً من commit `${{ github.sha }}`.
            Unity ${{ steps.meta.outputs.unity }} · IL2CPP ARM64+ARMv7 · Android 7.0+ (API 24).
            حمّل الملف بالأسفل وثبّته على الموبايل (فعّل "مصادر غير معروفة").
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
