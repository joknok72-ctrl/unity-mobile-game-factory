name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.0.82f1

jobs:
  build:
    name: Unity ${{ env.UNITY_VERSION }} -> Android (IL2CPP ARM64+ARMv7)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      # The unityci/editor image is ~8 GB; reclaim disk on the runner first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Restore Android keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/reallifesky.keystore"
          echo "KEYSTORE_FILE=reallifesky.keystore" >> "$GITHUB_ENV"

      - name: Build with GameCI unity-builder
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildName: RealLifeSky
          buildsPath: build
          buildMethod: BuildScript.Build
          androidExportType: androidPackage
          androidTargetSdkVersion: AndroidApiLevel34
          androidKeystoreName: ${{ env.KEYSTORE_FILE }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          androidVersionCode: ${{ github.run_number }}
          versioning: Custom
          version: 0.1.${{ github.run_number }}
          allowDirtyBuild: true

      - name: Locate APK
        id: apk
        run: |
          APK=$(find build -name '*.apk' | head -n 1)
          test -n "$APK" || { echo "No APK produced"; ls -R build; exit 1; }
          sudo chown -R "$USER" build
          cp "$APK" "RealLifeSky-v0.1.${{ github.run_number }}.apk"
          echo "path=RealLifeSky-v0.1.${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"
          ls -lh *.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealLifeSky-Android
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Real Life Sky v0.1.${{ github.run_number }}
          body: |
            APK مبني تلقائياً من commit `${{ github.sha }}`.
            Unity ${{ env.UNITY_VERSION }} · URP 17 · IL2CPP ARM64+ARMv7 · Android 7.0+ (API 24).
            حمّل ملف الـ APK بالأسفل وثبّته على الموبايل (فعّل "مصادر غير معروفة").
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
