# الخطوة 1 للحصول على ترخيص Unity Personal (مجاني) لبناء الـ APK:
#   Actions → "Request Unity activation file" → Run workflow → حمّل Artifact (ملف .alf)
#   ثم افتح https://license.unity3d.com/manual وارفع الـ .alf → Personal → حمّل .ulf
#   وانسخ محتوى .ulf كنص في Secret باسم UNITY_LICENSE (+ UNITY_EMAIL, UNITY_PASSWORD).
name: Request Unity activation file

on:
  workflow_dispatch:

jobs:
  alf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: alf
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.0.82f1
      - uses: actions/upload-artifact@v4
        with:
          name: Unity_v6000.0.82f1.alf
          path: ${{ steps.alf.outputs.filePath }}
